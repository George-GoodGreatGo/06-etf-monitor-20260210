name: Refresh LowVol Snapshots

on:
  schedule:
    # GitHub cron uses UTC. Beijing 21:35 on weekdays = UTC 13:35 on weekdays.
    # Run once at 21:35 Beijing time every Monday through Friday.
    - cron: "35 13 * * 1-5"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Refresh (scheduled)
        if: github.event_name == 'schedule'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LOWVOL_REFRESH_MODE: full_backfill_publish
        run: |
          echo "LOWVOL_REFRESH_MODE=$LOWVOL_REFRESH_MODE event=${{ github.event_name }}"
          npx tsx server/scripts/refreshLowVolSnapshots.ts

      - name: Refresh (manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LOWVOL_REFRESH_MODE: full_backfill_publish
        run: |
          echo "LOWVOL_REFRESH_MODE=$LOWVOL_REFRESH_MODE event=${{ github.event_name }}"
          npx tsx server/scripts/refreshLowVolSnapshots.ts
