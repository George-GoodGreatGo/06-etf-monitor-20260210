name: Refresh LowVol Snapshots

on:
  schedule:
    # GitHub cron uses UTC. Beijing 20:00–22:00 = UTC 12:00–14:00
    # Run every 15 minutes during 20:00–21:59 Beijing time.
    - cron: "0,15,30,45 12-13 * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Refresh (scheduled)
        if: github.event_name == 'schedule'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LOWVOL_REFRESH_MODE: full_backfill_publish
        run: |
          echo "LOWVOL_REFRESH_MODE=$LOWVOL_REFRESH_MODE event=${{ github.event_name }}"
          npx tsx server/scripts/refreshLowVolSnapshots.ts

      - name: Refresh (manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LOWVOL_REFRESH_IGNORE_WINDOW: "1"
          LOWVOL_REFRESH_MODE: full_backfill_publish
        run: |
          echo "LOWVOL_REFRESH_MODE=$LOWVOL_REFRESH_MODE event=${{ github.event_name }}"
          npx tsx server/scripts/refreshLowVolSnapshots.ts
