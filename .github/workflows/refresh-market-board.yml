name: Refresh Market Board (Supabase Only)

on:
  schedule:
    - cron: '0 13 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: incremental 或 backfill
        required: false
        default: backfill
      marketDataSource:
        description: 数据源策略（financedata/eastmoney-http/akshare-first）
        required: false
        default: financedata
      startDate:
        description: backfill 起始日期（YYYYMMDD，可选）
        required: false
        default: '20160101'
      endDate:
        description: backfill 结束日期（YYYYMMDD，可选）
        required: false

permissions:
  contents: read

concurrency:
  group: refresh-market-board
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node deps
        run: npm ci

      - name: Install Python deps
        run: python -m pip install -r server/python/requirements.txt

      - name: Refresh market board points to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            export MARKET_DATA_SOURCE="financedata"
          else
            export MARKET_DATA_SOURCE="${{ github.event.inputs.marketDataSource }}"
          fi
          if [ -z "$MARKET_DATA_SOURCE" ]; then export MARKET_DATA_SOURCE="financedata"; fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            mode="backfill"
          else
            mode="${{ github.event.inputs.mode }}"
          fi
          startDate="${{ github.event.inputs.startDate }}"
          endDate="${{ github.event.inputs.endDate }}"
          if [ -z "$mode" ]; then mode="backfill"; fi
          echo "MARKET_DATA_SOURCE=$MARKET_DATA_SOURCE mode=$mode startDate=$startDate endDate=$endDate"
          sleep_sec=$(( (RANDOM % 600) + 1 ))
          echo "jitter sleep ${sleep_sec}s"
          sleep "$sleep_sec"
          if [ "$mode" = "backfill" ]; then
            if [ -z "$startDate" ]; then startDate="20160101"; fi
            npm run backfill:supabase:market-board -- --startDate "$startDate" --endDate "$endDate"
          else
            npm run refresh:supabase:market-board
          fi
