name: Refresh Top100 Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * 1-5'
    - cron: '59 15 * * 1-5'

permissions:
  contents: read

concurrency:
  group: refresh-top100
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node deps
        run: npm ci

      - name: Install Python deps
        run: python -m pip install -r server/python/requirements.txt

      - name: Refresh snapshot to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOP100_LIMIT: '200'
        run: npm run refresh:supabase:top100
