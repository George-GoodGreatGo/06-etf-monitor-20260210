name: Refresh Top100 Snapshot

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Refresh LowVol Snapshots"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: refresh-top100
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node deps
        run: npm ci

      - name: Install Python deps
        run: python -m pip install -r server/python/requirements.txt

      - name: Refresh snapshot to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COZE_STREAM_RUN_URL: ${{ secrets.COZE_STREAM_RUN_URL }}
          COZE_BEARER_TOKEN: ${{ secrets.COZE_BEARER_TOKEN }}
          COZE_PROJECT_ID: ${{ secrets.COZE_PROJECT_ID }}
          COZE_SESSION_ID: ${{ secrets.COZE_SESSION_ID }}
          TOP100_LIMIT: '200'
          TOP100_SIGNAL_DEBUG_TICKERS: '518800'
        run: npm run refresh:supabase:top100
