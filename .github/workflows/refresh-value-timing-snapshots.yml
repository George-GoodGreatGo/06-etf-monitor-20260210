name: Refresh Value Timing Snapshots

on:
  schedule:
    # GitHub cron uses UTC. Beijing 20:00–22:00 = UTC 12:00–14:00
    # Run every 15 minutes during 20:00–21:59 Beijing time.
    - cron: "0,15,30,45 12-13 * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Refresh (scheduled)
        if: github.event_name == 'schedule'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VALUE_TIMING_REFRESH_MODE: full_backfill_publish
          NODE_OPTIONS: --dns-result-order=ipv4first
          CHINAMONEY_FETCH_MAX_ATTEMPTS: "7"
          CHINAMONEY_FETCH_BASE_DELAY_MS: "2000"
          ETF_PROXY_MAX_ATTEMPTS: "6"
          ETF_PROXY_BASE_DELAY_MS: "1200"
          VALUE_TIMING_980081_BASELINE_FILE: "参考文档_for_references/价值100-pettm-2026-04-15.xlsx"
        run: |
          echo "VALUE_TIMING_REFRESH_MODE=$VALUE_TIMING_REFRESH_MODE event=${{ github.event_name }}"
          ls -l "$VALUE_TIMING_980081_BASELINE_FILE"
          npx tsx server/scripts/refreshValueTimingSnapshots.ts

      - name: Refresh (manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VALUE_TIMING_REFRESH_IGNORE_WINDOW: "1"
          VALUE_TIMING_REFRESH_MODE: full_backfill_publish
          NODE_OPTIONS: --dns-result-order=ipv4first
          CHINAMONEY_FETCH_MAX_ATTEMPTS: "7"
          CHINAMONEY_FETCH_BASE_DELAY_MS: "2000"
          ETF_PROXY_MAX_ATTEMPTS: "6"
          ETF_PROXY_BASE_DELAY_MS: "1200"
          VALUE_TIMING_980081_BASELINE_FILE: "参考文档_for_references/价值100-pettm-2026-04-15.xlsx"
        run: |
          echo "VALUE_TIMING_REFRESH_MODE=$VALUE_TIMING_REFRESH_MODE event=${{ github.event_name }}"
          ls -l "$VALUE_TIMING_980081_BASELINE_FILE"
          npx tsx server/scripts/refreshValueTimingSnapshots.ts
